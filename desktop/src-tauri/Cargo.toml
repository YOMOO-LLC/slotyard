[package]
name = "slotyard-desktop"
version = "0.1.3"
description = "slotyard menu bar app — live slot status"
authors = ["slotyard"]
edition = "2021"

[lib]
name = "slotyard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
