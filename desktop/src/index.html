<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slotyard</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="app" class="glass-panel">
      <header class="panel-header">
        <span class="title">slotyard</span>
        <span id="repo" class="repo">—</span>
        <button id="btn-refresh" class="icon-btn" title="Full rescan">↻</button>
        <button id="btn-repo" class="icon-btn" title="Settings">⋯</button>
      </header>

      <div id="view-main" class="view">
        <button id="alert" class="alert hidden"></button>
        <div id="scroll" class="scroll">
          <div id="list"></div>
          <div id="findings"></div>
        </div>
      </div>

      <div id="view-detail" class="view hidden">
        <header class="panel-header detail-head">
          <button id="btn-back" class="icon-btn" title="Back">‹</button>
          <span id="d-slot" class="title">SLOT</span>
          <span id="d-name" class="repo"></span>
        </header>
        <div class="detail-body">
          <h1 id="d-title"></h1>
          <div id="d-meta" class="meta"></div>
          <div id="d-path" class="path"></div>
          <div id="d-ports" class="ports"></div>
          <table>
            <thead>
              <tr>
                <th>Service</th>
                <th>State</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="d-roles"></tbody>
          </table>
          <div class="detail-actions">
            <button id="d-wake" class="btn primary">Wake sleeping</button>
            <button id="d-sleep" class="btn">Sleep non-core</button>
          </div>
        </div>
      </div>

      <div id="view-settings" class="view hidden">
        <header class="panel-header detail-head">
          <button id="btn-settings-back" class="icon-btn" title="Back">‹</button>
          <span class="title">Settings</span>
        </header>
        <div id="settings-body" class="settings-body">
          <section class="settings-section">
            <h2>Repos</h2>
            <div class="setting-row">
              <div class="setting-main">
                <div class="setting-label">Monitored</div>
                <div class="setting-note">A finding in any of these raises the tray badge.</div>
              </div>
              <button id="btn-change-repo" class="btn">Add…</button>
            </div>
            <div id="recent-repos" class="recent-repos"></div>
            <div class="setting-row">
              <div class="setting-main">
                <div class="setting-label">Resolved layouts</div>
                <div id="settings-layout" class="setting-value"></div>
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h2>Startup</h2>
            <div class="setting-row">
              <label class="switch-row" for="launch-login">
                <span>Launch at login</span>
                <input id="launch-login" type="checkbox" class="switch-input" />
                <span class="switch" aria-hidden="true"></span>
              </label>
            </div>
            <div id="launch-note" class="setting-note"></div>
          </section>

          <section class="settings-section">
            <h2>Scanning</h2>
            <div class="setting-row">
              <div class="setting-main">
                <label class="setting-label" for="poll-seconds">Poll interval (seconds)</label>
                <div id="poll-note" class="setting-note"></div>
              </div>
              <input id="poll-seconds" type="number" min="1" step="1" class="number-input" />
            </div>
            <div class="setting-row">
              <label class="switch-row" for="pause-scanning">
                <span>Pause scanning</span>
                <input id="pause-scanning" type="checkbox" class="switch-input" />
                <span class="switch" aria-hidden="true"></span>
              </label>
            </div>
          </section>

          <section class="settings-section">
            <h2>Tray badge</h2>
            <div id="badge-mode" class="segmented">
              <button class="badge-option" data-mode="critical_and_warning">Critical and warning</button>
              <button class="badge-option" data-mode="critical">Critical only</button>
              <button class="badge-option" data-mode="never">Never</button>
            </div>
          </section>

          <section class="settings-section">
            <h2>Findings</h2>
            <div id="mute-list" class="mute-list"></div>
            <div class="setting-note">Critical findings cannot be muted.</div>
          </section>

          <section class="settings-section">
            <h2>Advanced</h2>
            <div class="setting-row">
              <div class="setting-main">
                <div class="setting-label">CLI path override</div>
                <div id="settings-cli" class="setting-value mono"></div>
              </div>
              <div class="setting-actions">
                <button id="btn-change-cli" class="btn">Change…</button>
                <button id="btn-clear-cli" class="btn">Clear</button>
              </div>
            </div>
            <div class="setting-row">
              <div class="setting-main">
                <div class="setting-label">Path actually used</div>
                <div id="settings-cli-resolved" class="setting-value mono"></div>
                <div id="settings-cli-source" class="setting-note"></div>
              </div>
            </div>
            <div class="setting-row">
              <button id="btn-open-config" class="btn">Open config file</button>
              <div id="settings-version" class="setting-note"></div>
            </div>
          </section>
        </div>
      </div>

      <div id="status" class="status-bar"></div>
    </div>
  </body>
</html>
